"ui.virtual.indent-guide" = "highlight"
"ui.virtual.inlay-hint" = { fg = "comment", bg = "panel" }
"ui.virtual.jump-label" = { fg = "pink", modifiers = ["bold"] }

"ui.selection" = { bg = "border" }

"ui.cursor" = { fg = "bg", bg = "comment" }
"ui.cursor.primary" = { fg = "bg", bg = "text" }
