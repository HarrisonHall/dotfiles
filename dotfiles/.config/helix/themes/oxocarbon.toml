# UI:

"ui.background" = { fg= "text", bg = "bg"}
# "ui.separator" = "bg"

"ui.linenr" = { fg = "comment" }
"ui.linenr.selected" = { fg = "text" }

"ui.statusline" = { fg = "text", bg = "panel" }
"ui.statusline.inactive" = { fg = "comment", bg = "bg" }
"ui.statusline.normal" = { fg = "bg", bg = "pink", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "bg", bg = "green", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "bg", bg = "purple", modifiers = ["bold"] }

"ui.popup" = { fg = "text", bg = "panel" }
"ui.window" = { fg = "bg" }
# "ui.window" = { fg = "text", bg = "bg" }
"ui.help" = { fg = "panel", bg = "bg" }

"ui.bufferline" = { fg = "highlight", bg = "mantle" }
"ui.bufferline.active" = { fg = "purple", bg = "base", underline = { color = "purple", style = "line" } }
"ui.bufferline.background" = { bg = "highlight" }

"ui.text" = "text"
"ui.text.focus" = { fg = "text", bg = "panel", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "border" }
