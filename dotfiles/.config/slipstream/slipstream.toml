# slipstream configuration.

freq = "5min"
workers = 8
timezone = "local"
log = "/tmp/slipstream.log"
storage = 4096
database = "./slip.db"

# Here are the feeds I tend to care about:
# - /all (everything)
# - /tag/fun (fun things)
# - /tag/gaming (game things)
# - /tag/gov (gov things)
# - /feed/dont-miss (can't miss these!)


# Settings that apply to **everything**.
[global]

[global.limits.headers]
user-agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36"

[global.filters]
exclude-titles = [
  "sport",
  "nfl",
  "scores",
  "#shorts",
  "llm",
  "agentic",
  "doge",
  "vibe-coding",
  "vibecoding",
]
exclude-substrings = [
  "sport",
  "soccer",
  "サッカー",
  "football",
  "フットボール",
  "basketball",
  "バスケットボール",
  "trump",
  "トランプ",
  "musk",
  "イーロン",
  "-ai",
  ".ai",
]
exclude-tags = [
  "sports",
  "vibecoding",
]

[global.transforms.tag-derivations]
"hacking" = ["rust", "zig", "c++", "python"]
"japanese" = ["japan", "日本", "にほん", "anime", "manga"]
"gaming" = ["games", "switch", "singleplayer", "multiplayer"]
"science" = ["environment", "climate", "climate change"]
"sports" = ["basketball", "baseball", "nfl", "nhl", "fifa", "soccer"]
"releases" = ["release", "version"]

[global.transforms.tag-aliases]
"news" = ["report", "society"]

[global.transforms]
author = "{feed_fallback}"

[global.options]
# Maximum feeds returned, something sane.
max = 512
# Oldest entry returned.
oldest = "1month"
# Default feed update frequency.
freq = "2hrs"


[serve]

# Settings that apply to the all feed.
[serve.all]
max = 256

[serve.all.filters]
exclude-tags-strict = ["satire", "social"]


# Feed definitions and settings.
[feeds]


